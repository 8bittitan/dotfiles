[tools]
golang = '1.25'
ruby = "3.4.7"
zig = "0.15.2"
rust = 'latest'
lua = "latest"
bun = "latest"
zls = "0.15.1"
go = "1.25.6"
node = { version = "latest", postinstall = "corepack enable" }
atuin = "18.24.2"
zoxide = "0.10.0"
television = "0.15.9"
starship = "1.26.0"
yazi = "26.8.15"
lazygit = "0.64.1"
poetry = "2.2.1"
buf = "1.73.0"
uv = "0.12.13"
"vfox:jdx/vfox-php" = "8.5.11"
herdr = "0.9.3"
worktrunk = "0.81.0"
gopass = "1.17.4"
bat = "0.26.1"
eza = "0.23.5"
fd = "10.5.1"
gh = "2.103.3"
jq = "1.8.2"
k9s = "0.51.0"
ripgrep = "15.2.0"
ripgrep-all = "0.10.10"
terraform = "1.12.2"
tmux = "3.7c"
vale = "3.26.0"
delta = "0.20.1"
kubectl = "1.37.2"
coreutils = "0.12.0"
fzf = "0.74.5"
ffmpeg = "9.0.2"
neovim = "0.12.6"
"aqua:bensadeh/tailspin" = "7.0.0"
just = "1.59.0"

[settings]
legacy_version_file = true
plugin_autoupdate_last_check_duration = '1 week'
trusted_config_paths = [
  '~/.config',
  '~/.dotfiles',
  '~/projects/'
]

activate_aggressive = true
verbose = false
asdf_compat = true
jobs = 4
raw = false
yes = false

not_found_auto_install = true
task = {output = 'prefix'}
paranoid = false

env_file = '.env'
experimental = true
status = {missing_tools = 'always', show_env = false, show_tools = false}
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "go"]
